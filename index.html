<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBA4 Task Management App</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Task Management</h1>
    <form id="taskForm">
      <label for="taskName">Task Name:</label>
      <input
        type="text"
        id="taskName"
        name="taskName"
        placeholder="Name of Task"
      />
      <label for="category">Category:</label>
      <input
        type="text"
        id="category"
        name="category"
        placeholder="Category Type"
      />
      <label for="deadline">Deadline:</label>
      <input
        type="date"
        id="deadline"
        name="deadline"
      />
      <label for="status">Status:</label>
      <select id="status" name="status">
        <option value="To Do">To Do</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Overdue">Overdue</option>
      </select>
      <button type="submit" id="addTask">Add Task</button>
    </form>
    <!--Filter Tasks bullet two and three -->
    
    <div id="filterSection">
      <h3>Filter Tasks</h3>
      <label for="filterCategory">Category:</label>
      <input
        type="text"
        id="filterCategory"
        name="filterCategory"
        placeholder="Type a category to filter (or leave blank)"
      />
       <label for="filterStatus">Status:</label>
      <select id="filterStatus" name="filterStatus">
        <option value="All">All Statuses</option>
        <option value="To Do">To Do</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Overdue">Overdue</option>
      </select>
      <button type="button" id="applyFiltersBtn">Apply Filters</button>
      <button type="button" id="clearFiltersBtn">Clear Filters</button>
      
    </div>
    <ul id="taskAdded"></ul>
  </body>
</html>
